name: ai-hub

services:
  app:
    build:
      context: .
      target: development
    ports:
      - "4310:4310"
    environment:
      NODE_ENV: development
      PORT: 4310
      DB_PATH: /app/data/ai-hub.db
      MEDIA_ROOT: /app/storage
      MAX_UPLOAD_BYTES: ${AI_HUB_MAX_UPLOAD_BYTES:-21474836480}
      BASE_PATH: ${BASE_PATH:-}
    volumes:
      - .:/app
      - ai-hub-node-modules:/app/node_modules
      - ai-hub-data:/app/data
      - ${AI_HUB_MEDIA_STORAGE:-ai-hub-media}:/app/storage
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4310/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  check:
    profiles: ["tools"]
    build:
      context: .
      target: verification
    environment:
      NODE_ENV: test
      DB_PATH: /tmp/ai-hub-check.db
      MEDIA_ROOT: /tmp/ai-hub-media
    command: ["npm", "run", "check"]
    tmpfs:
      - /tmp

  test:
    profiles: ["tools"]
    build:
      context: .
      target: verification
    environment:
      NODE_ENV: test
      DB_PATH: /tmp/ai-hub-test.db
      MEDIA_ROOT: /tmp/ai-hub-media
      MAX_UPLOAD_BYTES: 10485760
    command: ["npm", "test"]
    tmpfs:
      - /tmp

  production:
    profiles: ["production"]
    build:
      context: .
      target: production
    ports:
      - "127.0.0.1:4310:4310"
    environment:
      NODE_ENV: production
      PORT: 4310
      DB_PATH: /app/data/ai-hub.db
      MEDIA_ROOT: /app/storage
      MAX_UPLOAD_BYTES: ${AI_HUB_MAX_UPLOAD_BYTES:-21474836480}
      BASE_PATH: ${BASE_PATH:-}
    volumes:
      - ai-hub-data:/app/data
      - ${AI_HUB_MEDIA_STORAGE:-ai-hub-media}:/app/storage
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4310/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

volumes:
  ai-hub-data:
  ai-hub-node-modules:
  ai-hub-media:
